[package]
name = "scribewatch"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["GodsQuantum"]
description = "Self-hosted voice notes and audio transcription to Markdown"
license = "MIT"
repository = "https://github.com/GodsQuantum/ScribeWatch"
keywords = ["transcription", "markdown", "obsidian", "self-hosted", "voice-notes"]
categories = ["multimedia::audio", "web-programming::http-server"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures-util = "0.3"
mime_guess = "2"
notify = "8.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
