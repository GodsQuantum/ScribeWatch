name: One-shot rustfmt repair

on:
  push:
    branches: [fix/format-latest-main]

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format Rust sources
        run: cargo +1.98.0 fmt --all
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm -f .github/workflows/rustfmt-repair.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push origin HEAD:fix/format-latest-main
