name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Canonical CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Version consistency
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches package versions
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          EXPECTED="${GITHUB_REF_NAME#v}"

          CARGO_VERSION="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])'
          )"

          FRONTEND_VERSION="$(
            python3 -c \
              'import json; print(json.load(open("frontend/package.json"))["version"])'
          )"

          echo "tag=$EXPECTED"
          echo "cargo=$CARGO_VERSION"
          echo "frontend=$FRONTEND_VERSION"

          test "$EXPECTED" = "$CARGO_VERSION"
          test "$EXPECTED" = "$FRONTEND_VERSION"

  appimage:
    name: Native AppImage
    needs: [validate, version]
    uses: ./.github/workflows/appimage.yml

  full-native:
    name: Full local-AI macOS and Linux installers
    needs: [validate, version]
    uses: ./.github/workflows/native-full-portable.yml

  slim-desktop:
    name: Desktop lightweight Windows and macOS installers
    needs: [validate, version]
    uses: ./.github/workflows/desktop-installer.yml

  image:
    name: Release image / ${{ matrix.arch }}
    needs: [validate, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/publish architecture-specific image on native runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          tags: ghcr.io/godsquantum/scribewatch:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  publish:
    name: Publish multi-architecture manifest and draft release
    needs: [image, full-native, windows-standalone, appimage, slim-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify manifest from two certified native builds
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --metadata-file /tmp/scribewatch-image-metadata.json \
            -t "ghcr.io/godsquantum/scribewatch:${GITHUB_REF_NAME}" \
            -t ghcr.io/godsquantum/scribewatch:latest \
            "ghcr.io/godsquantum/scribewatch:${GITHUB_SHA}-amd64" \
            "ghcr.io/godsquantum/scribewatch:${GITHUB_SHA}-arm64"
          DIGEST="$(jq -r '.["containerimage.descriptor"].digest' /tmp/scribewatch-image-metadata.json)"
          [[ "$DIGEST" == sha256:* ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "ghcr.io/godsquantum/scribewatch:${GITHUB_REF_NAME}"

      - name: Attest multiarch published manifest
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/godsquantum/scribewatch
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create draft GitHub release, pending AppImage checksum validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ScribeWatch $GITHUB_REF_NAME" \
            --generate-notes \
            --draft

  windows-standalone:
    name: Validate native Windows full installer (mandatory release gate)
    needs: [validate, version]
    uses: ./.github/workflows/standalone-windows.yml

  attach-appimage:
    name: Attach verified native installers
    needs: [publish, appimage, windows-standalone, full-native, slim-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scribewatch-appimage-*
          path: dist
          merge-multiple: true

      - name: Download verified full Windows standalone setup
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scribewatch-full-standalone-windows-amd64
          path: dist/windows

      - name: Download verified full native Linux installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scribewatch-full-linux-*
          path: dist/full
          merge-multiple: true

      - name: Download verified full native macOS installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scribewatch-full-macos-*
          path: dist/full
          merge-multiple: true

      - name: Download lightweight Mac and Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-unsigned-*
          path: dist/slim
          merge-multiple: true

      - name: Verify all lightweight installers
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/slim -maxdepth 1 -type f -name '*windows-amd64-setup.exe' | wc -l)" -eq 1
          test "$(find dist/slim -maxdepth 1 -type f -name '*windows-amd64-setup.exe.sha256' | wc -l)" -eq 1
          test "$(find dist/slim -maxdepth 1 -type f -name '*darwin-*.dmg' | wc -l)" -eq 2
          test "$(find dist/slim -maxdepth 1 -type f -name '*darwin-*.dmg.sha256' | wc -l)" -eq 2
          (cd dist/slim && sha256sum -c ./*.sha256)

      - name: Verify Windows setup checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/windows -maxdepth 1 -type f -name '*standalone-setup.exe' | wc -l)" -eq 1
          test "$(find dist/windows -maxdepth 1 -type f -name '*standalone-setup.exe.sha256' | wc -l)" -eq 1
          (cd dist/windows && sha256sum -c ./*.exe.sha256)

      - name: Verify downloaded AppImages
        shell: bash
        run: |
          set -euo pipefail
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.AppImage.sha256' | wc -l)" -eq 2
          (
            cd dist
            sha256sum -c ./*.AppImage.sha256
          )

      - name: Require both architectures of full Mac and Linux installers
        shell: bash
        run: |
          set -euo pipefail
          for extension in '*.dmg' '*.dmg.sha256' '*-standalone.AppImage' '*-standalone.AppImage.sha256' '*.deb' '*.deb.sha256'; do
            test "$(find dist/full -maxdepth 1 -type f -name "$extension" | wc -l)" -eq 2
          done
          (
            cd dist/full
            sha256sum -c ./*.sha256
          )

      - name: Attach AppImages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.AppImage \
            dist/*.AppImage.sha256 \
            dist/windows/*standalone-setup.exe \
            dist/windows/*standalone-setup.exe.sha256 \
            dist/full/*-standalone.dmg \
            dist/full/*-standalone.dmg.sha256 \
            dist/full/*-standalone.AppImage \
            dist/full/*-standalone.AppImage.sha256 \
            dist/full/*.deb \
            dist/full/*.deb.sha256 \
            dist/slim/*.exe \
            dist/slim/*.dmg \
            dist/slim/*.sha256

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
