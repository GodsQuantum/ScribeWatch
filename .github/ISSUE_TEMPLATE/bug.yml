name: Bug report
description: Report a reproducible ScribeWatch problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ScribeWatch version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove secrets/private transcript text)
